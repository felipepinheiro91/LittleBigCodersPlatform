services:
  - type: web
    name: littlebigcoders-api
    runtime: python
    plan: free
    rootDir: LittleBIGCodersPlataform/backend
    buildCommand: pip install -r requirements-production.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --access-logfile -
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
  - type: web
    name: littlebigcoders-web
    runtime: static
    rootDir: LittleBIGCodersPlataform/frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
